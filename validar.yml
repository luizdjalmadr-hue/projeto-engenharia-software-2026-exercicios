name: Validar entrega

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir pastas alteradas
        id: alvo
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          PASTAS=$(git diff --name-only "$BASE"...HEAD \
                    | grep -oE '^(exercicios/aula[0-9]{2}|projeto)' \
                    | sort -u | tr '\n' ' ')
          PUML=$(git diff --name-only "$BASE"...HEAD | grep -E '\.puml$' | tr '\n' ' ')
          echo "pastas=$PASTAS" >> "$GITHUB_OUTPUT"
          echo "puml=$PUML"     >> "$GITHUB_OUTPUT"
          [ -z "$PASTAS" ] && echo "vazio=true" >> "$GITHUB_OUTPUT" \
                           || echo "vazio=false" >> "$GITHUB_OUTPUT"
          echo "Pastas: ${PASTAS:-nenhuma}"
          echo "Diagramas: ${PUML:-nenhum}"

      - name: Verificar título do pull request
        id: titulo
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITULO" | grep -qE '^\[(Aula [0-9]{2}|Rota Escolar M[1-8])\] .+'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar RESPOSTAS.md
        id: respostas
        if: steps.alvo.outputs.vazio == 'false'
        run: |
          FALTANDO=""
          for P in ${{ steps.alvo.outputs.pastas }}; do
            case "$P" in
              exercicios/aula*) [ -f "$P/RESPOSTAS.md" ] || FALTANDO="$FALTANDO $P" ;;
            esac
          done
          echo "faltando=$FALTANDO" >> "$GITHUB_OUTPUT"
          [ -z "$FALTANDO" ] && echo "ok=true" >> "$GITHUB_OUTPUT" \
                             || echo "ok=false" >> "$GITHUB_OUTPUT"

      # Um .puml que nao compila indica diagrama que nunca foi visualizado,
      # e diagrama nunca visualizado costuma estar errado.
      - name: Instalar PlantUML
        if: steps.alvo.outputs.puml != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq plantuml

      - name: Compilar diagramas alterados
        id: diagramas
        if: steps.alvo.outputs.puml != ''
        continue-on-error: true
        run: |
          set -o pipefail
          FALHOU=0
          for F in ${{ steps.alvo.outputs.puml }}; do
            echo "::group::$F"
            plantuml -failfast2 -checkonly "$F" 2>&1 | tee -a /tmp/puml.txt || FALHOU=1
            echo "::endgroup::"
          done
          exit $FALHOU

      - uses: astral-sh/setup-uv@v5
        if: steps.alvo.outputs.vazio == 'false'
        with:
          python-version: '3.13'

      - name: Rodar testes, se houver
        id: testes
        if: steps.alvo.outputs.vazio == 'false'
        continue-on-error: true
        run: |
          set -o pipefail
          if find ${{ steps.alvo.outputs.pastas }} -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            uv pip install --system pytest
            pytest ${{ steps.alvo.outputs.pastas }} -v --tb=short 2>&1 | tee /tmp/pytest.txt
          else
            echo "Nenhum teste Python encontrado nas pastas alteradas." | tee /tmp/pytest.txt
          fi

      - name: Comentar no pull request
        if: always()
        uses: actions/github-script@v7
        env:
          VAZIO:      ${{ steps.alvo.outputs.vazio }}
          PASTAS:     ${{ steps.alvo.outputs.pastas }}
          PUML:       ${{ steps.alvo.outputs.puml }}
          TITULO_OK:  ${{ steps.titulo.outputs.ok }}
          RESP_OK:    ${{ steps.respostas.outputs.ok }}
          RESP_FALT:  ${{ steps.respostas.outputs.faltando }}
          DIAGRAMAS:  ${{ steps.diagramas.outcome }}
          TESTES:     ${{ steps.testes.outcome }}
        with:
          script: |
            const fs = require('fs');
            const e = process.env;
            const ler = (p) => { try { return fs.readFileSync(p,'utf8').slice(-4000); }
                                 catch { return '(nao executou)'; } };
            const L = ['## Verificação automática da entrega', ''];

            if (e.VAZIO === 'true') {
              L.push('Nenhuma pasta de exercício foi alterada neste pull request.', '',
                     'Verifique se os arquivos foram salvos dentro de `exercicios/aulaNN/`.');
            } else {
              L.push(`Pastas avaliadas: \`${e.PASTAS.trim()}\``, '');
              L.push('| Item | Resultado |', '|---|---|');
              L.push(`| Título do pull request | ${e.TITULO_OK === 'true' ? 'no padrão' : 'fora do padrão `[Aula NN] Seu Nome`'} |`);
              L.push(`| \`RESPOSTAS.md\` | ${e.RESP_OK === 'true' ? 'presente' : 'ausente em `' + (e.RESP_FALT||'').trim() + '`'} |`);
              if (e.PUML.trim()) {
                L.push(`| Diagramas PlantUML | ${e.DIAGRAMAS === 'success' ? 'compilam' : 'erro de sintaxe'} |`);
              } else {
                L.push('| Diagramas PlantUML | nenhum alterado |');
              }
              L.push(`| Testes | ${e.TESTES === 'success' ? 'passaram ou não havia' : 'falharam'} |`);
              L.push('');
              if (e.PUML.trim() && e.DIAGRAMAS !== 'success') {
                L.push('<details><summary>Erros nos diagramas</summary>', '', '```', ler('/tmp/puml.txt'), '```', '', '</details>');
              }
              L.push('<details><summary>Saída dos testes</summary>', '', '```', ler('/tmp/pytest.txt'), '```', '', '</details>');
              L.push('');
              L.push('A verificação automática cobre apenas forma e sintaxe. A correção pelos critérios da disciplina — corretude 35, justificativa 30, qualidade dos artefatos 25, clareza 10 — é feita manualmente.');
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: L.join('\n'),
            });

      - name: Falhar se houver erro de forma
        if: |
          steps.alvo.outputs.vazio == 'false' &&
          (steps.respostas.outputs.ok == 'false' ||
           (steps.alvo.outputs.puml != '' && steps.diagramas.outcome != 'success') ||
           steps.testes.outcome != 'success')
        run: exit 1
